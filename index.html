<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b0f19"><title>Bug Invaders</title>
<style>
:root{color-scheme:dark;--bg:#0b0f19;--panel:#111827;--muted:#9ca3af;--amber:#f59e0b;--green:#10b981;--cyan:#06b6d4;--purple:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8fafc;font:16px Rubik,system-ui,sans-serif;overflow:hidden}button{font:inherit;color:inherit;border:0;cursor:pointer}#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;inset:12px 14px auto;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand,.stats,.hero-panel{background:#111827dc;border-radius:18px;padding:10px 14px;backdrop-filter:blur(8px)}.brand{font-weight:800;letter-spacing:.02em}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:3px}.stats{text-align:left;direction:ltr;line-height:1.65;font-size:13px}.stats b{color:var(--amber)}.bar{height:5px;width:100px;border-radius:5px;background:#374151;overflow:hidden;display:inline-block;vertical-align:middle;margin-inline-start:5px}.bar i{display:block;height:100%;background:var(--green);width:100%}.team{position:fixed;top:88px;right:14px;display:flex;gap:7px;max-width:calc(100vw - 28px);overflow:auto;scrollbar-width:none}.team button{min-width:48px;min-height:48px;background:#111827dc;border-radius:15px;padding:5px 9px;color:#cbd5e1}.team button.active{outline:2px solid var(--amber);color:white}.team span{display:block;font-size:11px;margin-top:2px}.bottom{position:fixed;bottom:0;inset-inline:0;height:30%;min-height:150px;touch-action:none;background:linear-gradient(0deg,#11182760,transparent);display:flex;align-items:flex-end;justify-content:center;padding-bottom:max(18px,env(safe-area-inset-bottom));pointer-events:auto}.hint{background:#111827cc;color:#cbd5e1;padding:10px 16px;border-radius:16px;font-size:13px;pointer-events:none}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#0b0f19d9;padding:20px}.card{width:min(430px,100%);padding:26px;background:#111827;border-radius:26px;text-align:center}.card h1{margin:0 0 8px;font-size:32px}.card p{color:#cbd5e1;line-height:1.55}.primary{min-height:52px;padding:0 24px;border-radius:16px;background:var(--amber);color:#111827;font-weight:800;margin-top:8px}.hidden{display:none!important}.announce{position:fixed;top:150px;left:50%;transform:translateX(-50%);background:#111827e8;padding:10px 16px;border-radius:14px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}.announce.show{opacity:1}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style></head><body>
<canvas id="game" aria-label="זירת Bug Invaders"></canvas>
<div class="hud"><div class="brand">BUG INVADERS<small id="stageName">שלב 1 · חדירת הנחיל</small></div><div class="stats">SCORE <b id="score">0000</b><br>CORE <span class="bar"><i id="core"></i></span><br>ABILITY <span class="bar"><i id="charge" style="background:#3b82f6;width:0%"></i></span></div></div>
<nav class="team" id="team" aria-label="בחירת חבר צוות"></nav><div class="bottom" id="touch"><div class="hint">גררו לתנועה · הקישו לירי · החליקו מעלה ליכולת</div></div><div class="announce" id="announce"></div>
<div class="overlay" id="intro"><div class="card"><h1>Bug Invaders</h1><p>הנחיל תוקף את הליבה. גייסו חבר צוות, אספו תיקוני קוד, והגנו על המערכת בשלושה שלבים.</p><p>משחק ביד אחת: גרירה לתנועה, הקשה לירי, החלקה מעלה להפעלת יכולת.</p><button class="primary" id="start">מתחילים להגן</button></div></div>
<div class="overlay hidden" id="end"><div class="card"><h1 id="endTitle">המשחק הסתיים</h1><p id="endText"></p><button class="primary" id="restart">משחק חדש</button></div></div>
<script>
(()=>{'use strict';const c=document.querySelector('#game'),x=c.getContext('2d'),teamEl=document.querySelector('#team'),scoreEl=document.querySelector('#score'),coreEl=document.querySelector('#core'),chargeEl=document.querySelector('#charge'),announceEl=document.querySelector('#announce');
const bots=[['🟠','קיה','האטת זמן'],['🔵','Forge','קרן חודרת'],['🛡️','Firewall','מחסום'],['🌀','LoadBalancer','פינוי נחיל'],['🧹','סדר','מחיקת סוג'],['📡','Radar','חשיפת איום'],['🧠','Adaptive','בונוס דפוס'],['🎨','PixelSmith','אזור ניקוד'],['✅','QA','נקודת חולשה']];let W,H,dpr,player,bugs,shots,patches,particles,score,core,charge,stage,elapsed,spawnT,last,active,playing,fireT,shield,beam,slow,weak,zone,radar,pattern,keys=new Set();
bots.forEach((b,i)=>{let z=document.createElement('button');z.type='button';z.innerHTML=b[0]+'<span>'+b[1]+'</span>';z.title=b[1]+' · '+b[2];z.setAttribute('aria-label',z.title);z.onclick=()=>select(i);teamEl.append(z)});
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);if(player)player.y=H*.79}addEventListener('resize',resize);resize();
function select(i){active=i;[...teamEl.children].forEach((b,n)=>b.classList.toggle('active',n===i));say(bots[i][1]+' — '+bots[i][2])}
function reset(){player={x:W/2,y:H*.79,r:20};bugs=[];shots=[];patches=[];particles=[];score=0;core=100;charge=0;stage=1;elapsed=0;spawnT=0;fireT=0;shield=0;beam=0;slow=0;weak=0;zone=0;radar=0;pattern=0;playing=true;last=performance.now();document.querySelector('#intro').classList.add('hidden');document.querySelector('#end').classList.add('hidden');select(0);requestAnimationFrame(loop)}
function say(t){announceEl.textContent=t;announceEl.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>announceEl.classList.remove('show'),1400)}
function activate(){if(!playing||charge<100)return;charge=0;let msg='';switch(active){case 0:slow=2;bugs.sort((a,b)=>b.y-a.y);if(bugs[0])bugs[0].marked=2;msg='קיה מאטה את הזמן';break;case 1:beam=4;msg='Forge: קרן חודרת';break;case 2:shield=3;msg='Firewall: מחסום פעיל';break;case 3:bugs.splice(0,Math.ceil(bugs.length/2));msg='LoadBalancer איזן את העומס';break;case 4:let kind=bugs[0]?.kind;if(kind){bugs=bugs.filter(b=>b.kind!==kind);msg='סדר ניקה סוג באגים'}else msg='הזירה נקייה';break;case 5:radar=5;msg='Radar חושף איומים';break;case 6:pattern=6;msg='Adaptive למד את הדפוס';break;case 7:zone=6;msg='PixelSmith יצר אזור ניקוד';break;case 8:weak=5;msg='QA חשף נקודת תורפה';break}say(msg)}
function fire(){if(!playing||fireT>0)return;fireT=.22;shots.push({x:player.x,y:player.y-20,v:beam?650:520,r:beam?5:3,life:1.5,pierce:beam>0})}
let down=null;const touch=document.querySelector('#touch');touch.addEventListener('pointerdown',e=>{e.preventDefault();down={x:e.clientX,y:e.clientY,start:e.clientY,id:e.pointerId};touch.setPointerCapture(e.pointerId);player.x=e.clientX});touch.addEventListener('pointermove',e=>{if(down&&down.id===e.pointerId)player.x=Math.max(24,Math.min(W-24,e.clientX))});function endTouch(e,cancelled){if(!down||down.id!==e.pointerId)return;let start=down;down=null;if(touch.hasPointerCapture(e.pointerId))touch.releasePointerCapture(e.pointerId);if(cancelled)return;if(start.start-e.clientY>35)activate();else if(Math.abs(start.x-e.clientX)<12)fire()}touch.addEventListener('pointerup',e=>endTouch(e,false));touch.addEventListener('pointercancel',e=>endTouch(e,true));addEventListener('keydown',e=>{if(e.repeat)return;keys.add(e.key);if(e.key===' '){e.preventDefault();fire()}if(e.key==='ArrowUp')activate()});addEventListener('keyup',e=>keys.delete(e.key));
function spawn(){let boss=stage===3&&bugs.length===0;let n=boss?3:1;for(let i=0;i<n;i++)bugs.push({x:boss?W*(.25+i*.25):24+Math.random()*(W-48),y:boss?-45-i*32:-30,r:boss?27:15,hp:boss?7:1,kind:boss?'queen':Math.floor(Math.random()*3),v:(boss?30:50+Math.random()*35)*(stage===2?1.5:1),phase:Math.random()*7,hidden:stage===2&&Math.random()<.4})}
function burst(a,b,color){for(let i=0;i<7;i++)particles.push({x:a,y:b,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,t:.45,color})}
function loop(now){if(!playing)return;let dt=Math.min(.04,(now-last)/1000);last=now;elapsed+=dt;fireT-=dt;if(beam>0)beam-=dt;if(slow>0)slow-=dt;if(weak>0)weak-=dt;if(zone>0)zone-=dt;if(radar>0)radar-=dt;if(shield>0)shield-=dt;if(pattern>0)pattern-=dt;if(stage===1&&elapsed>24){stage=2;say('שלב 2 · מרתף המוטציות')}if(stage===2&&elapsed>52){stage=3;say('שלב 3 · ליבת הכאוס')}spawnT-=dt;if(spawnT<=0&&(stage<3||bugs.length===0)){spawn();spawnT=stage===1?.8:stage===2?.55:999}
let move=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);player.x=Math.max(20,Math.min(W-20,player.x+move*W*.7*dt));if(keys.has(' '))fire();if(zone>0&&Math.random()<dt*1.2)score++;
for(let s of shots){s.y-=s.v*dt;s.life-=dt}shots=shots.filter(s=>s.life>0&&s.y>-20);for(let b of bugs){b.phase+=dt;b.y+=b.v*dt*(slow>0?.4:1);b.x+=Math.sin(b.phase*1.4)*24*dt;if(b.y>player.y-22&&Math.abs(b.x-player.x)<b.r+18){if(shield<=0)core-=15;b.hp=0;burst(b.x,player.y,'#06b6d4')}if(b.y>H+30){core-=b.kind==='queen'?12:8;b.hp=0}}
for(let s of shots){for(let b of bugs){if(b.hp>0&&Math.hypot(s.x-b.x,s.y-b.y)<s.r+b.r){b.hp-=(weak>0&&b.kind==='queen'?3:1)+(pattern>0?1:0);s.life=0;if(!s.pierce)s.y=-100;if(b.hp<=0){score+=b.kind==='queen'?250:10;charge=Math.min(100,charge+8);burst(b.x,b.y,b.kind==='queen'?'#8b5cf6':'#ef4444');if(Math.random()<.18)patches.push({x:b.x,y:b.y,r:9})}}}}
for(let p of patches){p.y+=50*dt;if(Math.hypot(p.x-player.x,p.y-player.y)<25){score+=25;core=Math.min(100,core+5);charge=Math.min(100,charge+10);p.y=H+50}}bugs=bugs.filter(b=>b.hp>0&&b.y>-110);patches=patches.filter(p=>p.y<H+30);if(stage===3&&!bugs.length&&spawnT>0){document.querySelector('#endTitle').textContent='הליבה ניצלה!';finish(true)}else if(core<=0)finish(false);
paint(now/1000);scoreEl.textContent=String(score).padStart(4,'0');coreEl.style.width=Math.max(0,core)+'%';chargeEl.style.width=charge+'%';document.querySelector('#stageName').textContent=['','שלב 1 · חדירת הנחיל','שלב 2 · מרתף המוטציות','שלב 3 · ליבת הכאוס'][stage];requestAnimationFrame(loop)}
function paint(t){x.clearRect(0,0,W,H);x.fillStyle='#0b0f19';x.fillRect(0,0,W,H);x.fillStyle='#ffffff12';for(let i=0;i<34;i++){let px=(i*137)%W,py=(i*83+t*9)%H;x.fillRect(px,py,2,2)}if(zone>0){x.fillStyle='#8b5cf622';x.fillRect(W*.15,H*.35,W*.7,H*.25)}for(let p of patches){x.fillStyle='#10b981';x.beginPath();x.roundRect(p.x-9,p.y-9,18,18,5);x.fill();x.fillStyle='white';x.font='12px sans-serif';x.fillText('</>',p.x-9,p.y+4)}for(let s of shots){x.fillStyle=beam>0?'#3b82f6':'#f59e0b';x.fillRect(s.x-s.r,s.y-12,s.r*2,14)}for(let b of bugs){x.font=(b.kind==='queen'?50:32)+'px system-ui';x.textAlign='center';x.fillText(b.kind==='queen'?'👑':b.hidden&&radar<=0?'❔':'🐛',b.x,b.y+12);if(b.marked>0){b.marked-=.016;x.strokeStyle='#f59e0b';x.lineWidth=2;x.beginPath();x.arc(b.x,b.y,24,0,7);x.stroke()}if(b.kind==='queen'){x.fillStyle='#374151';x.fillRect(b.x-30,b.y+20,60,5);x.fillStyle='#8b5cf6';x.fillRect(b.x-30,b.y+20,60*Math.max(0,b.hp/7),5)}}x.font='44px system-ui';x.textAlign='center';x.fillText(['🟠','🔵','🛡️','🌀','🧹','📡','🧠','🎨','✅'][active],player.x,player.y+12);if(shield>0){x.strokeStyle='#06b6d4';x.lineWidth=3;x.beginPath();x.arc(player.x,player.y,29,0,7);x.stroke()}for(let p of particles){p.x+=p.vx*.016;p.y+=p.vy*.016;p.t-=.016;x.globalAlpha=Math.max(0,p.t*2);x.fillStyle=p.color;x.fillRect(p.x,p.y,4,4)}x.globalAlpha=1;particles=particles.filter(p=>p.t>0)}
function finish(win){if(!playing)return;playing=false;document.querySelector('#endTitle').textContent=win?'הליבה ניצלה!':'הליבה נפלה';document.querySelector('#endText').textContent=`ניקוד סופי: ${score} · ${win?'הצוות הביס את מלכת הבאגים.':'הבאגים הגיעו לליבה.'}`;document.querySelector('#end').classList.remove('hidden')}
document.querySelector('#start').onclick=reset;document.querySelector('#restart').onclick=reset;
})();
</script></body></html>
